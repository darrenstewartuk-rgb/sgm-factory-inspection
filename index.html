<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#194b39">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>SGM Factory Inspection</title>
  <script defer src="js/config.js"></script>
  <script defer src="js/db.js"></script>
  <script defer src="js/report.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="screen">
    <header class="masthead">
      <div class="mast-inner">
        <div class="brand"><span class="brand-mark">SGM</span><span>SGM Windows Manufacturing Ltd</span></div>
        <span id="offline" class="offline" role="status">Preparing offline use…</span>
      </div>
    </header>
    <main id="app">
      <p role="status">Opening inspection records…</p>
      <noscript>Enable JavaScript to use the inspection app.</noscript>
    </main>
    <div id="notice" class="notice" role="status"></div>
  </div>
  <article id="report" aria-label="Inspection report"></article>
</body>
</html>
