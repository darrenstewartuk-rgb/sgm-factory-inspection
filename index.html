</style></head><body><header id="header"></header><main id="app"></main><div class="toast" id="toast"></div><script>
'use strict';
const C={version:'1.3',company:'SGM Window Manufacturing Ltd',location:'1,2,3,5 and 6, Honywood Square, Honywood Rd, Basildon SS14 3HT, UK',units:['Unit 1','Unit 2','Unit 3','Unit 4','Unit 5','Unit 6','Spray Room','Unit 1 Offices','Unit 2 Offices','Customer Care Offices','Accounts Offices','Dispatch Office','Aluminium Office','Reception Area'],assignees:['Darren Stewart','Gary May','Dominic Mann'],sections:[
['General Workplace','Workplace (Health, Safety and Welfare) Regulations 1992',['Safety signage is visible and legible','Floors are free from slip and trip hazards','Designated walkways are clean and unobstructed','Floor is clear of waste around containers and bins','Work areas are organised for safe operation','Loading areas are clear','Products are stored correctly, preventing trip hazards']],
['Fire & Emergency Provisions','Regulatory Reform (Fire Safety) Order 2005',['Fire assembly point is clearly marked','Fire exits are clearly marked','Fire exits are clear of obstructions','Combustibles are stored away from exits and stairs','Fire registers are up to date with line leaders','Fire alarm call points are clear and unobstructed','Fire doors have correct safety devices fitted','Fire extinguishers are free from obstruction, undamaged, fully charged and in date','Emergency spill kits are present']],
['Electrical','Electricity at Work Regulations 1989 / PUWER 1998',['PAT testing is within 12 months','Cables are free from damage and splits','Sockets are visibly undamaged','Machine isolators are in good order']],
['PPE','Personal Protective Equipment at Work Regulations 1992',['Hi-Viz is worn where appropriate','Eye, glove and ear protection is worn where appropriate','Safety footwear is worn and in good condition']],
['Manual & Mechanical Handling','Manual Handling Operations Regulations 1992',['Good manual handling techniques are observed','Manual handling aids are in use','Trolley and cart wheels are free from debris and moving freely']],
['Equipment & Machinery','Provision and Use of Work Equipment Regulations 1998',['Areas around machinery are clean and clear','Machinery is in good working order','Fixed guards are secured by approved means only','Safety stops are functioning correctly','Areas are free of trailing cables','Pre-start checks completed with visible signed checklists by machines','Hoses are free from compressed air leaks']],
['Hazardous Substances','Control of Substances Hazardous to Health Regulations 2002',['Substances are stored and secured in a COSHH cabinet to prevent unauthorised use']],
['Facilities & Welfare','Workplace (Health, Safety and Welfare) Regulations 1992',['General illumination and loading bay lamps are working','Welfare facilities are clean and acceptable (toilets, sinks, kitchen)']],
['Racking & General Storage','Provision and Use of Work Equipment Regulations 1998',['Racking and stillage — loaded and empty systems are secure and undamaged','Damaged racking is isolated and made unavailable']],
['Visual Display Units (DSE)','Health and Safety (Display Screen Equipment) Regulations 1992 — workplace inspection checks; individual users may also require a separate workstation assessment',['Screens are positioned at a comfortable height and viewing distance, with adjustable tilt where needed','Screens are clear, readable and free of excessive glare or reflections','Keyboards are positioned comfortably with sufficient space for hands and wrists','Mouse or other pointing device is within easy reach and operates correctly','Workstation chairs are stable, adjustable and provide suitable back support','Users can place feet flat on the floor or have an appropriate footrest where needed','Desks provide sufficient working space and allow comfortable legroom','Lighting is adequate for screen and paperwork tasks without excessive glare','Cables and electrical connections are safely routed and free from visible damage','Users have suitable arrangements for breaks or changes of activity away from sustained screen work','DSE users have been informed of assessment, training and eye-test arrangements','Any reported discomfort or individual workstation requirements have been referred for assessment']]
]};
const S={screen:'home',insp:null,si:0,qi:0,extraAssignees:[],deferredInstall:null};let db,persistTimer;
const $=id=>document.getElementById(id),html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeAttr=html;const fmt=d=>new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function score(secs){let pass=0,scored=0,flag=0,actions=0,answered=0,total=0;for(const sec of secs)for(const q of sec.questions){total++;if(q.status!==null)answered++;if(q.status&&q.status!=='na'){scored++;if(q.status==='pass')pass++;if(q.status==='fail'||q.status==='action')flag++}actions+=(q.actions||[]).length}return{pass,scored,flag,actions,answered,total,pct:scored?Math.round(pass/scored*100):null}}
function pill(pct){return `<span class="pill ${pct===null?'none':pct>=90?'good':pct>=70?'mid':'low'}">${pct===null?'In progress':pct+'%'}</span>`}
function fresh(){return{id:Date.now()+Math.floor(Math.random()*1000),title:'',conductedOn:new Date().toISOString(),preparedBy:'',location:C.location,units:[],status:'in-progress',sections:C.sections.map((s,i)=>({id:i,questions:s[2].map(t=>({text:t,status:null,notes:'',photos:[],actions:[]}))})),generalComment:{rating:null,text:''}}}
function normaliseInspection(x){
 if(!x||!Array.isArray(x.sections))return x;
 x.units=Array.isArray(x.units)?x.units:[];
 x.generalComment=x.generalComment||{rating:null,text:''};
 C.sections.forEach((def,i)=>{
   if(!x.sections[i])x.sections[i]={id:i,questions:[]};
   if(!Array.isArray(x.sections[i].questions))x.sections[i].questions=[];
   def[2].forEach((question,j)=>{
     if(!x.sections[i].questions[j])x.sections[i].questions[j]={text:question,status:null,notes:'',photos:[],actions:[]};
     const q=x.sections[i].questions[j];
     q.text=q.text||question;q.photos=Array.isArray(q.photos)?q.photos:[];
     q.actions=Array.isArray(q.actions)?q.actions:[];
   });
 });
 return x;
}
function newAction(){return{id:Date.now()+Math.random(),description:'',assignees:[],priority:'Medium',dueDate:''}}
function openDb(){return new Promise((resolve,reject)=>{let r=indexedDB.open('sgm_inspection_v1',1);r.onupgradeneeded=()=>{let st=r.result.createObjectStore('inspections',{keyPath:'id'});st.createIndex('conductedOn','conductedOn')};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function operation(mode,fn){return new Promise((resolve,reject)=>{let tx=db.transaction('inspections',mode),store=tx.objectStore('inspections'),r=fn(store);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
const save=()=>operation('readwrite',st=>st.put(S.insp));const all=()=>operation('readonly',st=>st.getAll());const load=id=>operation('readonly',st=>st.get(id));const remove=id=>operation('readwrite',st=>st.delete(id));
function autosave(){clearTimeout(persistTimer);persistTimer=setTimeout(()=>{if(S.insp)save().catch(e=>toast('Save error: '+e.message))},300)}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>$('toast').style.display='none',2600)}
function go(screen,si=S.si,qi=S.qi){S.screen=screen;S.si=si;S.qi=qi;render();window.scrollTo(0,0)}
function head(title,back,extra=''){const h=$('header');h.innerHTML=`${back?'<button id="back">←</button>':'<span class="logo">SGM</span>'}<h1>${html(title)}</h1>${extra}`;if(back)$('back').onclick=back}
function wrapper(body,cls=''){ $('app').innerHTML=`<div class="content ${cls}">${body}</div>` }
async function home(){head('SGM Factory Inspection');const data=(await all()).sort((a,b)=>b.id-a.id);$('app').innerHTML=`<div class="hero"><h2>Factory Inspection v${C.version}</h2><p>${C.company}</p></div><div class="content home-content"><button class="btn primary wide" id="new">+ New Inspection</button>${data.length?`<div class="heading">Past Inspections</div><div class="card">${data.map(x=>`<div class="inspection"><div class="info" data-open="${x.id}"><strong>${html(x.title||'Untitled inspection')}</strong><div class="small">${html(x.units.join(', ')||'No areas selected')} • ${fmt(x.conductedOn)}</div></div>${pill(score(x.sections).pct)}<button class="delete" data-del="${x.id}" aria-label="Delete inspection">×</button></div>`).join('')}</div>`:`<div class="empty">📋<p>No inspections yet.<br>Tap New Inspection to begin.</p></div>`}<div class="actionsbar noprint"><button class="btn ghost" id="backup">Export Backup</button><button class="btn ghost" id="restore">Import Backup</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></div>`;$('new').onclick=()=>{S.insp=fresh();go('setup')};document.querySelectorAll('[data-open]').forEach(e=>e.onclick=async()=>{S.insp=normaliseInspection(await load(Number(e.dataset.open)));go('audit')});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=async()=>{if(confirm('Delete this inspection? This cannot be undone.')){await remove(Number(e.dataset.del));home()}});$('backup').onclick=async()=>download(JSON.stringify({format:'sgm-inspection',version:1,inspections:await all()},null,2),'SGM_Inspections_Backup.json','application/json');$('restore').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(obj.format!=='sgm-inspection'||!Array.isArray(obj.inspections))throw Error('Invalid backup');if(!confirm('Import '+obj.inspections.length+' inspections? Existing records with matching IDs will be replaced.'))return;for(const x of obj.inspections){S.insp=normaliseInspection(x);await save()}S.insp=null;home();toast('Backup imported')}catch(err){alert('Import failed: '+err.message)}}}
function setup(){const x=S.insp;head('Inspection Details',()=>go('home'));wrapper(`<div class="field"><label>Audit Title</label><input id="title" placeholder="e.g. Unit 6 monthly inspection" value="${html(x.title)}"></div><div class="field"><label>Conducted On</label><input type="datetime-local" id="date" value="${localDate(x.conductedOn)}"></div><div class="field"><label>Prepared By</label><input id="by" placeholder="Inspector name" value="${html(x.preparedBy)}"></div><div class="field"><label>Location</label><div class="row"><textarea id="location" rows="2" class="grow">${html(x.location)}</textarea><button class="btn ghost" id="gps">📍 GPS</button></div></div><div class="field"><label>Inspection Areas (select one or more)</label><div class="small" style="margin-bottom:9px">Choose a factory unit, an office or reception. Select multiple areas only when the same inspection covers all of them.</div><div class="chips">${C.units.map(u=>`<button class="chip ${x.units.includes(u)?'selected':''}" data-unit="${html(u)}">${html(u)}</button>`).join('')}</div></div><div class="bottom"><button class="btn primary" id="begin">Start / Continue Inspection →</button></div>`);for(const key of ['title','by','location'])$(key).oninput=e=>{x[key==='by'?'preparedBy':key==='title'?'title':'location']=e.target.value;autosave()};$('date').onchange=e=>{x.conductedOn=new Date(e.target.value).toISOString();autosave()};document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{const u=b.dataset.unit;x.units=x.units.includes(u)?x.units.filter(v=>v!==u):[...x.units,u];b.classList.toggle('selected');autosave()});$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{x.location=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;$('location').value=x.location;autosave();toast('GPS location captured')},()=>toast('GPS unavailable or permission denied'));$('begin').onclick=async()=>{await save();go('audit')}}
function localDate(s){const d=new Date(s);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function audit(){const x=S.insp,t=score(x.sections);head(x.title||'Inspection',()=>go('home'),'<button id="edit" title="Edit details">⚙</button>');$('app').innerHTML=`<div class="score-banner"><div><div class="bigscore">${t.pct===null?'—':t.pct+'%'}</div><div>${t.pass}/${t.scored} questions passed</div><div style="opacity:.8;font-size:12px">${t.flag} flagged • ${t.actions} actions • ${t.answered}/${t.total} answered</div></div><span class="pill none">${t.pass} passed</span></div><div class="content"><div class="heading">All Inspection Categories — ${C.sections.length} sections, ${t.total} questions</div><div class="small" style="margin-bottom:12px">Select a category and question to record a result and take photographs. Mark checks that do not apply to the selected area as N/A. The DSE category is intended for office workstations.</div><div class="card">${C.sections.map((sec,i)=>{const q=score([x.sections[i]]);return `<div class="section-row" data-si="${i}"><span class="section-no">${i+1}</span><div class="grow"><strong>${html(sec[0])}</strong><div class="small">${q.answered}/${q.total} answered • ${q.flag} flagged</div></div>${pill(q.pct)}<span>›</span></div>`}).join('')}</div><div class="card section-row" id="comment"><div class="grow"><strong>General Comment</strong><div class="small">${html(x.generalComment.rating||'No rating')} • ${x.generalComment.text?'Comment saved':'Add overall observations'}</div></div>›</div><div class="actionsbar"><button class="btn secondary" id="report">View Report</button><button class="btn ghost" id="photos">Save Photos</button><button class="btn primary" id="pdf">Generate PDF</button></div></div>`;$('edit').onclick=()=>go('setup');document.querySelectorAll('[data-si]').forEach(e=>e.onclick=()=>go('section',Number(e.dataset.si)));$('comment').onclick=()=>go('comment');$('report').onclick=()=>go('report');$('photos').onclick=exportPhotos;$('pdf').onclick=()=>{go('report');setTimeout(()=>window.print(),120)}}
function section(){const i=S.si,sec=C.sections[i],qs=S.insp.sections[i].questions;head(sec[0],()=>go('audit'));wrapper(`<div class="small" style="padding:5px 3px 14px">${html(sec[1])}<div style="margin-top:8px">Tap any question to record its status, take photographs and add corrective actions.</div></div><div class="card">${qs.map((q,j)=>`<div class="question-row" data-qi="${j}"><span class="statusdot ${q.status||''}"></span><div class="grow"><strong>${j+1}. ${html(q.text)}</strong><div class="small">${q.status?label(q.status):'Not answered'}${q.photos.length?' • '+q.photos.length+' photos':''}${q.actions.length?' • '+q.actions.length+' actions':''}</div></div>›</div>`).join('')}</div><button class="btn secondary wide" id="overview">← Back to overview</button>`);document.querySelectorAll('[data-qi]').forEach(e=>e.onclick=()=>go('question',i,Number(e.dataset.qi)));$('overview').onclick=()=>go('audit')}
const label=s=>({pass:'Pass',action:'Action Required',fail:'Fail',na:'N/A'}[s]||'—');
function question(){const si=S.si,qi=S.qi,sec=C.sections[si],q=S.insp.sections[si].questions[qi],n=S.insp.sections[si].questions.length;head('Question '+(qi+1),()=>go('section'));wrapper(`<div class="card cardpad"><div class="small">Q${qi+1} of ${n} • ${html(sec[0])}</div><div class="q-title">${html(q.text)}</div></div><div class="statuses">${['pass','action','fail','na'].map(s=>`<button class="status ${s} ${q.status===s?'sel':''}" data-status="${s}">${label(s)}</button>`).join('')}</div><div class="heading">Notes</div><div class="field"><textarea id="notes" placeholder="Optional observation or comment..." rows="3">${html(q.notes)}</textarea></div><div class="heading">Photographs</div><div class="photos">${q.photos.map((p,i)=>`<div class="photo"><img src="${p}" alt="Inspection photo ${i+1}"><button data-delete-photo="${i}">×</button><a download="SGM_S${si+1}_Q${qi+1}_${i+1}.jpg" href="${p}">↓</a></div>`).join('')}</div><div class="photo-controls"><label class="photo-control camera" for="camera-input">📷 Take Photo<input type="file" id="camera-input" accept="image/*" capture="environment"></label><label class="photo-control" for="gallery-input">▧ Choose Photo<input type="file" id="gallery-input" accept="image/*" multiple></label></div><div class="small" style="margin-top:7px">Photos are attached to this question and saved locally on this device.</div>${q.status==='action'||q.status==='fail'?`<div class="heading">Corrective Actions</div><div id="actions">${q.actions.map((a,i)=>actionHtml(a,i)).join('')}</div><button class="btn secondary wide" id="addaction">+ Add Action</button>`:''}<div class="bottom"><button class="btn ghost" id="prev" ${qi===0?'disabled':''}>← Prev</button><button class="btn primary" id="next">${qi===n-1?'Section Overview':'Next →'}</button></div>`);document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{q.status=q.status===b.dataset.status?null:b.dataset.status;autosave();question()});$('notes').oninput=e=>{q.notes=e.target.value;autosave()};for(const inputId of ['camera-input','gallery-input'])$(inputId).onchange=async e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;let added=0;for(const f of files){try{if(!f.type.startsWith('image/'))throw Error('Not an image');q.photos.push(await shrink(f));added++}catch(err){toast('Could not read photo: '+err.message)}}try{await save();toast(added+' photo(s) saved')}catch(err){toast('Photo storage full or unavailable: '+err.message)}question()};document.querySelectorAll('[data-delete-photo]').forEach(b=>b.onclick=()=>{if(confirm('Remove this photograph?')){q.photos.splice(Number(b.dataset.deletePhoto),1);autosave();question()}});if($('addaction')){$('addaction').onclick=()=>{q.actions.push(newAction());autosave();question()};bindActions(q)}$('prev').onclick=()=>go('question',si,qi-1);$('next').onclick=()=>qi===n-1?go('section'):go('question',si,qi+1)}
function actionHtml(a,i){const people=[...new Set([...C.assignees,...S.extraAssignees,...a.assignees])];return `<div class="action"><div class="row"><strong class="grow">Action ${i+1}</strong><button class="delete" data-delete-action="${i}">×</button></div><label>Description</label><textarea rows="2" data-desc="${i}" placeholder="Corrective action required">${html(a.description)}</textarea><label>Assigned To</label><div class="options">${people.map(n=>`<button class="chip ${a.assignees.includes(n)?'selected':''}" data-assign="${i}" data-name="${html(n)}">${html(n)}</button>`).join('')}<button class="chip" data-newperson="${i}">+ Other</button></div><label>Priority</label><div class="options">${['Low','Medium','High'].map(p=>`<button class="priority ${a.priority===p?'sel':''}" data-priority="${i}" data-p="${p}">${p}</button>`).join('')}</div><label>Due Date</label><input type="date" data-due="${i}" value="${html(a.dueDate||'')}"></div>`}
function bindActions(q){document.querySelectorAll('[data-desc]').forEach(e=>e.oninput=ev=>{q.actions[Number(e.dataset.desc)].description=ev.target.value;autosave()});document.querySelectorAll('[data-due]').forEach(e=>e.onchange=ev=>{q.actions[Number(e.dataset.due)].dueDate=ev.target.value;autosave()});document.querySelectorAll('[data-assign]').forEach(e=>e.onclick=()=>{const a=q.actions[Number(e.dataset.assign)],n=e.dataset.name;a.assignees=a.assignees.includes(n)?a.assignees.filter(v=>v!==n):[...a.assignees,n];e.classList.toggle('selected');autosave()});document.querySelectorAll('[data-newperson]').forEach(e=>e.onclick=()=>{const n=prompt('Enter assignee name:')?.trim();if(!n)return;if(!S.extraAssignees.includes(n))S.extraAssignees.push(n);const a=q.actions[Number(e.dataset.newperson)];if(!a.assignees.includes(n))a.assignees.push(n);autosave();question()});document.querySelectorAll('[data-priority]').forEach(e=>e.onclick=()=>{q.actions[Number(e.dataset.priority)].priority=e.dataset.p;autosave();question()});document.querySelectorAll('[data-delete-action]').forEach(e=>e.onclick=()=>{if(confirm('Delete action?')){q.actions.splice(Number(e.dataset.deleteAction),1);autosave();question()}})}
function shrink(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1400/img.width,1400/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function comment(){const x=S.insp.generalComment;head('General Comment',()=>go('audit'));wrapper(`<div class="field"><label>Overall Rating</label><div class="options">${['Good','Satisfactory','Poor'].map(r=>`<button class="chip ${x.rating===r?'selected':''}" data-rating="${r}">${r}</button>`).join('')}</div></div><div class="field"><label>Comment</label><textarea rows="6" id="general" placeholder="General observations, positives, areas for improvement...">${html(x.text)}</textarea></div><div class="bottom"><button class="btn primary" id="done">Save & Return to Overview</button></div>`);document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{x.rating=b.dataset.rating;autosave();comment()});$('general').oninput=e=>{x.text=e.target.value;autosave()};$('done').onclick=async()=>{await save();go('audit');toast('Saved')}}
function report(){const x=S.insp,t=score(x.sections);head('Report Preview',()=>go('audit'));wrapper(`<div class="report-summary"><div class="bigscore">${t.pct===null?'—':t.pct+'%'}</div><div>${t.pass} of ${t.scored} questions passed</div><div style="margin-top:10px">${t.flag} flagged • ${t.actions} corrective actions</div></div><div class="heading">Inspection Details</div><div class="card cardpad"><strong>${html(x.title||'Untitled inspection')}</strong><div class="small">${fmt(x.conductedOn)}<br>Prepared by: ${html(x.preparedBy||'—')}<br>Location: ${html(x.location)}<br>Areas inspected: ${html(x.units.join(', ')||'—')}</div></div><div class="heading">Section Scores</div><div class="card cardpad">${C.sections.map((s,i)=>{const v=score([x.sections[i]]);return `<div class="report-line"><div class="name">${html(s[0])}</div><div class="progress"><div style="width:${v.pct||0}%"></div></div><strong>${v.pct===null?'—':v.pct+'%'}</strong></div>`}).join('')}</div><div class="heading">General Comment</div><div class="card cardpad"><strong>${html(x.generalComment.rating||'Not rated')}</strong><p>${html(x.generalComment.text||'No general comment recorded.')}</p></div><div class="heading">Findings & Actions</div>${C.sections.map((sec,si)=>{const qs=x.sections[si].questions;return `<div class="card cardpad print-section"><strong>${si+1}. ${html(sec[0])}</strong><div class="small">${html(sec[1])}</div>${qs.map((q,qi)=>`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px"><div><strong>${qi+1}. ${html(q.text)}</strong> <span class="pill ${q.status==='pass'?'good':q.status==='action'?'mid':q.status==='fail'?'low':'none'}">${q.status?label(q.status):'Unanswered'}</span></div>${q.notes?`<p>${html(q.notes)}</p>`:''}${q.actions.map(a=>`<div class="notice"><strong>Corrective action (${html(a.priority)})</strong>: ${html(a.description||'Not specified')}<br>Assigned: ${html(a.assignees.join(', ')||'Unassigned')} • Due: ${html(a.dueDate||'Not set')}</div>`).join('')}${q.photos.length?`<div class="photos">${q.photos.map(p=>`<div class="photo"><img src="${p}" alt="Finding photograph"></div>`).join('')}</div>`:''}</div>`).join('')}</div>`}).join('')}<div class="small" style="padding:15px">This inspection supports the employer duty of care under HASAWA 1974 s.2 and the requirement for a suitable and sufficient risk assessment under MHSWR 1999 reg.3. It does not replace the judgement of a competent assessor.</div><div class="actionsbar noprint"><button class="btn primary" id="print">Generate / Save PDF</button><button class="btn secondary" id="backreport">Back to Inspection</button></div>`);$('print').onclick=()=>window.print();$('backreport').onclick=()=>go('audit')}
function download(content,name,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function exportPhotos(){let photos=[];S.insp.sections.forEach((sec,i)=>sec.questions.forEach((q,j)=>q.photos.forEach((p,k)=>photos.push({p,n:`SGM_Photo_S${i+1}_Q${j+1}_${k+1}.jpg`}))));if(!photos.length){toast('No photos in this inspection');return}photos.forEach(({p,n},i)=>setTimeout(()=>{let a=document.createElement('a');a.href=p;a.download=n;a.click()},i*350));toast(`Saving ${photos.length} photo(s)`)}
function render(){switch(S.screen){case'home':home();break;case'setup':setup();break;case'audit':audit();break;case'section':section();break;case'question':question();break;case'comment':comment();break;case'report':report();break}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.deferredInstall=e});(async()=>{try{await openDb();render()}catch(e){$('app').textContent='Storage unavailable: '+e.message}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
